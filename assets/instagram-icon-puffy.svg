<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Inflated Instagram</title>
  <desc id="desc">Original logo and brand colors on a smooth inflated cushion. Background outline matches the Mail icon exactly.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#f9d6ff" />
      <stop offset=".22" stop-color="#db67ef" />
      <stop offset=".72" stop-color="#8a1455" />
      <stop offset="1" stop-color="#ffc686" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".96" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="spot">
      <stop stop-color="#fff" stop-opacity=".96" />
      <stop offset=".4" stop-color="#fff" stop-opacity=".43" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="ground" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#411447" flood-opacity=".32" />
    </filter>
    <path id="cushion" d="M145 28C201 18 311 18 367 28C441 39 474 72 485 145C495 202 495 310 485 367C474 441 441 474 367 485C311 495 201 495 145 485C71 474 38 441 27 367C17 310 17 202 27 145C38 72 71 39 145 28Z" />
    <clipPath id="blueClip">
