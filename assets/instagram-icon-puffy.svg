      <path d="M57 154C66 67 108 47 185 38C259 30 339 33 385 45" fill="none" stroke="#ffd3ff" stroke-width="15" opacity=".36" filter="url(#soft)" />
      <path d="M64 130C82 65 125 49 199 43C264 37 334 39 377 48" fill="none" stroke="url(#shine)" stroke-width="12" stroke-linecap="round" opacity=".32" filter="url(#soft)" />
      <path d="M42 181C30 243 37 330 49 363" fill="none" stroke="#f9b1ff" stroke-width="13" opacity=".28" filter="url(#soft)" />
      <path d="M68 399C91 447 131 456 180 460C259 468 334 462 379 451" fill="none" stroke="#742940" stroke-width="23" opacity=".13" filter="url(#soft)" />
      <path d="M101 458C173 484 345 485 408 451" fill="none" stroke="#ffcd99" stroke-width="8" opacity=".24" filter="url(#soft)" />
      <ellipse cx="115" cy="76" rx="57" ry="15" fill="url(#spot)" transform="rotate(-25 115 76)" />
      <ellipse cx="433" cy="147" rx="14" ry="53" fill="url(#spot)" opacity=".6" transform="rotate(-12 433 147)" />
      <use href="#cushion" fill="none" stroke="#812052" stroke-width="12" opacity=".13" />
    </g>
  </g>
